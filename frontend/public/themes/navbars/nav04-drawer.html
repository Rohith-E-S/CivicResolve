<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 — Drawer</title><style>*{box-sizing:border-box}body{margin:0;background:#18181B;color:#FAFAFA;font-family:Inter,sans-serif}header{height:48px;background:#27272A;border-bottom:1px solid #3F3F46;display:flex;align-items:center;justify-content:space-between;padding:0 1rem}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:#27272A;border-right:1px solid #3F3F46;padding:1rem;z-index:10;box-shadow:4px 0 24px rgba(0,0,0,.4)}.main{padding:1.2rem}.card{background:#27272A;border:1px solid #3F3F46;border-radius:8px;padding:1rem}.mono{font-family:JetBrains Mono,monospace;font-size:.65rem;color:#A1A1AA;letter-spacing:.06em;text-transform:uppercase}</style></head><body>
<header><div style="display:flex;gap:.5rem;align-items:center"><button style="background:transparent;border:1px solid #3F3F46;color:#FAFAFA;padding:.3rem .5rem;border-radius:6px">☰</button><span style="width:28px;height:28px;background:#fff;color:#000;display:grid;place-items:center;border-radius:4px;font-weight:900">⬢</span><b>CivicResolve</b></div><button style="background:#fff;color:#000;border:0;padding:.4rem .7rem;border-radius:6px;font-size:.75rem;font-weight:600">Dashboard</button></header>
<div class="scrim"></div><div class="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><b>Menu</b><button style="background:transparent;border:0;color:#A1A1AA">✕</button></div><p class="mono" style="margin-top:1rem">Citizen dashboard</p><div style="display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem"><button style="background:#fff;color:#000;border:0;padding:.6rem;border-radius:6px;text-align:left;font-weight:600">Overview</button><button style="background:transparent;color:#FAFAFA;border:1px solid #3F3F46;padding:.6rem;border-radius:6px;text-align:left">New complaint</button><button style="background:transparent;color:#FAFAFA;border:1px solid #3F3F46;padding:.6rem;border-radius:6px;text-align:left">Explore</button><button style="background:#fff;color:#000;border:0;padding:.6rem;border-radius:6px;text-align:left">Map view</button></div><div style="position:absolute;bottom:1rem;left:1rem;right:1rem"><button style="width:100%;background:transparent;color:#FAFAFA;border:1px solid #3F3F46;padding:.5rem;border-radius:6px">Log out</button></div></div>
<div class="main" style="margin-left:0"><div style="height:260px;background:#27272A;border:1px solid #3F3F46;border-radius:8px;display:grid;place-items:center;color:#A1A1AA">Map • Drawer overlays • Content dimmed behind</div><p class="mono" style="text-align:center;margin-top:1rem">04 — Drawer Overlay • ☰ toggles • Scrim • Mobile-first • Map stays full</p></div>
</body></html>
