<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>05 — Floating</title><style>*{box-sizing:border-box}body{margin:0;background:#18181B;color:#FAFAFA;font-family:Inter,sans-serif;padding:1rem}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}.pill{background:rgba(39,39,42,.9);border:1px solid #3F3F46;border-radius:999px;padding:.4rem .8rem;display:flex;gap:.4rem;align-items:center;backdrop-filter:blur(8px)}.map{height:320px;background:#27272A;border:1px solid #3F3F46;border-radius:16px;position:relative;overflow:hidden}.fab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(39,39,42,.9);border:1px solid #3F3F46;border-radius:999px;padding:.4rem .8rem;display:flex;gap:.3rem;align-items:center;backdrop-filter:blur(8px)}.mono{font-family:JetBrains Mono,monospace;font-size:.65rem;color:#A1A1AA;letter-spacing:.06em;text-transform:uppercase}</style></head><body>
<header><div class="pill"><span style="width:24px;height:24px;background:#fff;color:#000;display:grid;place-items:center;border-radius:50%;font-weight:900">⬢</span><b style="font-size:.85rem">CivicResolve</b><span class="mono" style="margin-left:.5rem;border-left:1px solid #3F3F46;padding-left:.5rem">GOBI</span></div><div class="pill"><span class="mono">32 in view</span><button style="background:#fff;color:#000;border:0;padding:.3rem .6rem;border-radius:999px;font-size:.7rem;font-weight:700;margin-left:.4rem">Share</button></div></header>
<div style="display:flex;gap:1rem"><div class="pill" style="flex-direction:column;align-items:stretch;padding:.6rem;width:200px;height:320px;justify-content:flex-start"><p class="mono">Layers</p><div style="background:#18181B;border:1px solid #3F3F46;border-radius:999px;padding:.4rem .6rem;display:flex;justify-content:space-between;align-items:center;margin-top:.4rem"><span style="display:flex;gap:.4rem;align-items:center;font-size:.75rem"><span style="width:6px;height:6px;background:#FF453A;border-radius:50%"></span>New</span><span class="mono">10</span></div><div style="background:#18181B;border:1px solid #3F3F46;border-radius:999px;padding:.4rem .6rem;display:flex;justify-content:space-between;margin-top:.3rem"><span style="font-size:.75rem">Active</span><span class="mono">12</span></div><p class="mono" style="margin-top:auto;text-align:center">Floating glass • No hard chrome</p></div><div class="map" style="flex:1"><div style="position:absolute;inset:1rem;border:1px dashed rgba(63,63,70,.5);border-radius:12px;pointer-events:none"></div><div class="fab"><span style="width:8px;height:8px;background:#FF453A;border-radius:50%"></span><span style="font-size:.75rem">New</span><span style="width:8px;height:8px;background:#FF9F0A;border-radius:50%;margin-left:.4rem"></span><span style="font-size:.75rem">Active</span></div><p style="position:absolute;bottom:.6rem;left:.6rem" class="mono">DeFlock glass • Backdrop blur • Floating</p></div></div>
<p class="mono" style="text-align:center;margin-top:1rem">05 — Floating Glass • Pill nav • Backdrop blur • No sidebar border</p>
</body></html>
